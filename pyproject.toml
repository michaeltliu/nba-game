[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-game"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "pandas",
    "redis"
]

[tool.setuptools]
py-modules = ["main", "game", "enums", "room", "test"]